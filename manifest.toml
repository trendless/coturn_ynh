packaging_format = 2

id = "coturn"
name = "Coturn"
description.en = "VoIP media traffic NAT traversal server and gateway"
description.fr = "Serveur et passerelle NAT du trafic média VoIP"

version = "4.6.1.1~ynh2"

maintainers = []

[upstream]
license = "BSD-3-Clause"
admindoc = "https://github.com/coturn/coturn/wiki"
code = "https://github.com/coturn/coturn"

[integration]
yunohost = ">= 12.1.12"
helpers_version = "2.1"
architectures = "all"
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

    [install.domain]
    type = "domain"

[resources]
    [resources.ports]
    turnserver.default = 3478
    turnserver.exposed = "Both"
    turnserver_tls.default = 5349
    turnserver_tls.exposed = "TCP"
    cli.default = 5766
    transit.default = "60100:60199"
    transit.exposed = "UDP"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]

    [resources.apt]
    packages = "sqlite3, libsqlite3-dev, coturn, acl"
